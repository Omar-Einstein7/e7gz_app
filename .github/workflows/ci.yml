name: Flutter CI Pipeline

on:
  push:
    branches: [ "main", "feature/cicd" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "feature/cicd" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.17)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. ANALYSIS & TESTING JOB
  analyze-and-test:
    name: Code Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        continue-on-error: true
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  # 2. ANDROID BUILD JOB
  build-android:
    name: Build Android APK & AAB
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Error: ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Error: ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "Error: ANDROID_KEY_ALIAS is missing"; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "Error: ANDROID_KEY_PASSWORD is missing"; exit 1; fi
          
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "Error: Keystore file is empty after decoding!"
            exit 1
          fi

      - name: Build Android Release Artifacts
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # 3. RELEASE JOB
  create-release:
    name: Create GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${{ github.event.inputs.tag_name }}" != "" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/*.apk \
            release-assets/*.aab \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
