name: Flutter CI Pipeline

on:
  push:
    branches: [ "main", "feature/cicd" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "feature/cicd" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.17)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ANDROID BUILD JOB
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release Artifacts
        run: |
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk


  # RELEASE JOB
  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          if [ "${{ github.event.inputs.tag_name }}" != "" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v1.0.${{ github.run_number }}"
          fi
          
          echo "Creating release for tag: $RELEASE_TAG"
          
          gh release create "$RELEASE_TAG" \
            release-assets/*.apk \
            --title "Release $RELEASE_TAG" \
            --generate-notes

        env:
          GH_TOKEN: ${{ github.token }}
