  # ============================================================================
  # SENTRY SOURCE MAP UPLOAD
  # Upload debug symbols / obfuscation mapping to Sentry after release.
  # Requires: SENTRY_AUTH_TOKEN secret and sentry-dart-plugin in pubspec.
  # ============================================================================
  
  upload-sentry-symbols:
    name: Upload Sentry Symbols
    runs-on: ubuntu-latest
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
  
      - name: Download symbols artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-production-release-*
          path: artifacts/
          merge-multiple: true
  
      - name: Upload symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm install -g @sentry/cli
          npx @sentry/cli debug-files upload \
            --org e7gz \
            --project e7gz-flutter \
            artifacts/symbols-production-*/
